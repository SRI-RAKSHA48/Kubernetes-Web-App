apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-web-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-web
  template:
    metadata:
      labels:
        app: student-web
    spec:
      containers:
        - name: student-web-container
          image: student-web-app:lab6-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80